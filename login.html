<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechFix Connect | Login</title>

   <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

   <link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<header>

    <nav class="navbar">

        <a href="index.html" class="logo">
            <img src="../images/logo.png" alt="TechFix Connect Logo">
            <h2>TechFix Connect</h2>
        </a>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="book-repair.html">Book Repair</a></li>
            <li><a href="track-repair.html">Track Repair</a></li>
            <li><a href="sell-device.html">Sell Device</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>

    </nav>

</header>


<section class="auth-section">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-icon">
                <i class="fa-solid fa-user"></i>
            </div>

            <h1>Welcome Back</h1>

            <p>Login to your TechFix Connect account.</p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <div class="form-options">

                    <label>
                        <input type="checkbox" id="rememberMe">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>


                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Login
                </button>

                <p id="loginMessage" class="form-message"></p>

            </form>


            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="register.html">Create an account</a>
                </p>

            </div>

        </div>

    </div>

</section>


<footer>

    <p class="copyright">
        © 2026 TechFix Connect. All Rights Reserved.
    </p>

</footer>

<script src="../js/script.js"></script>
<script src="../js/login.js"></script>

</body>

</html>
